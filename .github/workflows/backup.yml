name: Sauvegarde quotidienne
# 21:00 UTC = minuit à Antananarivo. Un échec envoie un e-mail GitHub au propriétaire du dépôt.
# ⚠ GitHub désactive les workflows planifiés d'un dépôt sans activité depuis 60 jours : gardez un commit récent
#   ou surveillez l'onglet Actions (voir docs/BACKUP.md).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency: { group: backup, cancel-in-progress: false }

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_CLIENT_VERSION: "17"   # >= version du serveur Supabase (Project Settings → Infrastructure)
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client PostgreSQL ${{ env.PG_CLIENT_VERSION }} (+ age)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${PG_CLIENT_VERSION} age
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Sauvegarder vers le stockage externe
        run: ./scripts/backup/backup.sh
        env:
          # URL « Session pooler » Supabase (IPv4) : les runners GitHub n'ont pas d'IPv6, la connexion directe échouerait.
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_DEST: ${{ secrets.BACKUP_DEST }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
